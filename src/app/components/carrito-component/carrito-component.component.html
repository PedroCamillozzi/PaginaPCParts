<div class="containerB">
    <h1 style="color: aliceblue;">Tu Carrito!</h1>
</div>

<div class="containerA">
    <div style="width: 95%; margin-left: 2.5%;">
      <div *ngFor=" let pc of productosCliente;">
        <div class="card mb-3 mt-3" style="max-height: 170px;">
          <div class="row g-0">
            <div class="col-md-4" style="width: 17%;">
              <img src="{{pc.imagen}}" class="img-fluid rounded-start" alt="...">
            </div>
            <div class="col-md-8">
              <div   class="card-body">
                <h5  class="card-title" ><a (click)="redirectToProducto(pc.idProducto)" style="cursor: pointer;">{{pc.nombreProducto}}</a></h5>
                <div *ngFor="let ppc of precioProductosCliente;">
                  <p *ngIf="ppc.idProducto == pc.idProducto" class="card-text">${{ppc.precio}}</p>
                </div>
                
              </div>
            </div>
            <div class="col-md-4 cant">
              <div *ngFor="let cc of carritoCliente; ">
                <div *ngIf="cc.idProducto == pc.idProducto">
                  <div *ngIf="cc.cantidad == 1; else elseBlock">
                    
                    <button class="btnCambioUnidad"  (click)="aumentarCantidad(cc)">↑</button>
                    <button class="btnBorrar" (click)="eliminarDelCarrito(cc)">x</button>
                    <p >Cantidad: <strong>{{cc.cantidad}}</strong> Unidad </p>
                    <button class="btnCambioUnidad" (click)="disminuirCantidad(cc)">↓</button>
                  </div>
                  <ng-template #elseBlock>
                    <button class="btnCambioUnidad" (click)="aumentarCantidad(cc)">↑</button>
                    <button class="btnBorrar" (click)="eliminarDelCarrito(cc)">x</button>
                    <p >Cantidad: <strong>{{cc.cantidad}}</strong> Unidades </p>
                    <button class="btnCambioUnidad" (click)="disminuirCantidad(cc)">↓</button>
                  </ng-template>
                  <div *ngFor="let ppc of precioProductosCliente;">
                    <div class="lblSubTotal" *ngIf="ppc.idProducto == pc.idProducto">
                      <p>Sub-Total: ${{ppc.precio * cc.cantidad}}</p>
                    </div>
                    
                  </div>
                  
                </div>
                  
              </div>
             
          </div>

          </div>
      </div>

      </div>
    </div>
    <div class="lblTotal">
      <p [(ngModel)]="total">Total: $<strong>{{total}}</strong> </p>
    </div>
    <div class="div-buy">
      <button type="button" class="btn btn-primary btn-buy" (click)="registrarPedido()">Comprar</button>

</div>
    
</div>
